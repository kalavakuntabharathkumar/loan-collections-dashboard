# Example Cloud Run deployment settings; set MONGODB_URI in Secret Manager.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: loan-collections-api
spec:
  template:
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/REPOSITORY/collections-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
